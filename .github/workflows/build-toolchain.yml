name: Build phone toolchain

# Builds Clang + lld (WebAssembly target) as static ARM64 programs, assembles the sysroot and the sandbox runner,
# tests everything with the lesson checks, and uploads one zip. Run it by hand: Actions > Build phone toolchain > Run workflow.
# Needs a PUBLIC repository (free ARM64 machines). Takes roughly 1.5 to 3.5 hours the first time, much less with the cache.
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - name: Machine
        run: |
          uname -m
          nproc
          free -g
          df -h /

      - name: Restore the build cache
        id: cache
        uses: actions/cache/restore@v4
        with:
          path: .ccache
          key: ccache-llvm19-${{ github.run_id }}
          restore-keys: ccache-llvm19-

      - name: Build static Clang and lld (Alpine, arm64)
        run: |
          mkdir -p out .ccache
          docker run --rm -v "$PWD:/repo" -v "$PWD/out:/out" -v "$PWD/.ccache:/ccache" alpine:3.20 sh /repo/tools/toolchain/build_llvm.sh

      - name: Save the build cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .ccache
          key: ccache-llvm19-${{ github.run_id }}

      - name: Assemble the toolchain
        run: bash tools/toolchain/assemble.sh out forge-toolchain

      - name: Test (lesson checks, library runner and command-line runner)
        run: bash tools/toolchain/test_toolchain.sh forge-toolchain

      - name: Pack
        run: |
          rm -rf forge-toolchain/pch forge-toolchain/wasmtime-host
          cd forge-toolchain && zip -r -q -y ../forge-toolchain-android-arm64.zip . && cd ..
          ls -la forge-toolchain-android-arm64.zip

      - uses: actions/upload-artifact@v4
        with:
          name: forge-toolchain-android-arm64
          path: forge-toolchain-android-arm64.zip
          retention-days: 30
